<header class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 shadow-xl border-b border-indigo-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <div class="flex items-center space-x-8">
                <a routerLink="/tasks" class="flex items-center space-x-3 group">
                    <div class="bg-white p-2 rounded-lg shadow-lg group-hover:shadow-xl transition-all group-hover:scale-105">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                    </div>
                    <span class="text-xl font-bold text-white group-hover:text-indigo-100 transition-colors">To-Do App</span>
                </a>
                <nav class="hidden md:flex space-x-1">
                    <a
                        routerLink="/tasks"
                        routerLinkActive="bg-indigo-800 shadow-lg"
                        class="px-4 py-2 rounded-lg text-white font-medium hover:bg-indigo-800 hover:shadow-lg transition-all"
                    >
                        Tasks
                    </a>
                    @if (authService.isAdmin()) {
                        <a
                            routerLink="/admin/users"
                            routerLinkActive="bg-indigo-800 shadow-lg"
                            class="px-4 py-2 rounded-lg text-white font-medium hover:bg-indigo-800 hover:shadow-lg transition-all"
                        >
                            Users
                        </a>
                    }
                </nav>
            </div>
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-3 bg-white bg-opacity-10 backdrop-blur-sm rounded-xl px-4 py-2 border border-white border-opacity-20">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-300 to-purple-300 flex items-center justify-center shadow-lg">
                            <svg class="w-4 h-4 text-indigo-800" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-white font-semibold text-sm leading-tight">
                                {{ authService.user()?.fullName || authService.user()?.email }}
                            </span>
                            @if (authService.isAdmin()) {
                                <span class="text-indigo-200 text-xs font-medium">Admin</span>
                            }
                        </div>
                    </div>
                </div>
                <button
                    (click)="onLogout()"
                    class="flex items-center space-x-2 bg-white bg-opacity-10 hover:bg-opacity-20 backdrop-blur-sm text-white font-semibold px-5 py-2.5 rounded-xl transition-all hover:shadow-lg border border-white border-opacity-20"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </div>
</header>
